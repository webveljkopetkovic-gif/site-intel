# One command brings up AnythingLLM + the pipeline API:   docker compose up -d
services:
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    ports: ["3001:3001"]
    cap_add: [SYS_ADMIN]
    environment:
      STORAGE_DIR: /app/server/storage
      # AnythingLLM's own chat model (used in its UI). Our pipeline calls Claude directly.
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL_PREF: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      # Local embeddings + local vector DB: no extra keys, data stays on the server.
      EMBEDDING_ENGINE: native
      VECTOR_DB: lancedb
      DISABLE_TELEMETRY: "true"
    volumes:
      - ./anythingllm-storage:/app/server/storage
    restart: unless-stopped

  api:
    build: .
    container_name: site-intel
    ports: ["8000:8000"]
    env_file: .env
    environment:
      ANYTHINGLLM_BASE_URL: http://anythingllm:3001
    volumes:
      - ./data:/app/data
    depends_on: [anythingllm]
    restart: unless-stopped
